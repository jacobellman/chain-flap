<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chain Flap 🧱🪽</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        canvas { display: block; }
        
        /* Menü Arayüzü */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
        }
        
        .menu-card {
            background: linear-gradient(145deg, #1a0033, #000);
            padding: 30px; border-radius: 20px; border: 2px solid #a855f7;
            text-align: center; box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
        }

        h1 { margin: 0 0 20px; font-size: 32px; background: linear-gradient(#fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .skin-list { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .skin-btn { 
            width: 50px; height: 50px; border: 2px solid #444; border-radius: 10px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px;
            background: #111; transition: 0.3s;
        }
        .skin-btn.active { border-color: #a855f7; box-shadow: 0 0 10px #a855f7; transform: scale(1.1); }

        button.start-btn {
            background: #a855f7; color: white; border: none; padding: 15px 40px;
            font-size: 20px; border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5);
        }

        #score-display {
            position: absolute; top: 20px; width: 100%; text-align: center;
            font-size: 40px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; display: none;
        }
    </style>
</head>
<body>

    <div id="score-display">0</div>

    <div id="ui-layer">
        <div class="menu-card">
            <h1>Chain Flap 🧱🪽</h1>
            <p>Karakterini Seç:</p>
            <div class="skin-list" id="skinSelector">
                <div class="skin-btn active" onclick="selectSkin(0)">🪽</div>
                <div class="skin-btn" onclick="selectSkin(1)">🧱</div>
                <div class="skin-btn" onclick="selectSkin(2)">⛽</div>
                <div class="skin-btn" onclick="selectSkin(3)">🚀</div>
                <div class="skin-btn" onclick="selectSkin(4)">👤</div>
            </div>
            <button class="start-btn" onclick="startGame()">BAŞLA</button>
            <p style="font-size: 12px; margin-top: 15px; color: #888;">Base & Farcaster Powered</p>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui-layer');
        const scoreDiv = document.getElementById('score-display');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameRunning = false;
        let score = 0;
        let currentSkin = "🪽";
        let bird = { x: 50, y: canvas.height/2, w: 40, h: 40, v: 0, g: 0.5, jump: -9 };
        let chains = [];
        let frame = 0;

        function selectSkin(index) {
            const icons = ["🪽⛓️", "🧱🪽", "⛽👻", "🚀🌀", "👤"];
            currentSkin = icons[index];
            document.querySelectorAll('.skin-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
        }

        function startGame() {
            ui.style.display = 'none';
            scoreDiv.style.display = 'block';
            resetGame();
            gameRunning = true;
        }

        function resetGame() {
            score = 0;
            bird.y = canvas.height / 2;
            bird.v = 0;
            chains = [];
            frame = 0;
            scoreDiv.innerText = score;
        }

        function draw() {
            // Arka Plan Gradient
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, "#000000");
            bgGrad.addColorStop(1, "#2D004F");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameRunning) {
                // Yerçekimi
                bird.v += bird.g;
                bird.y += bird.v;

                // Zincirler (Engeller)
                if (frame % 90 === 0) {
                    let gap = 170;
                    let top = 50 + Math.random() * (canvas.height - gap - 100);
                    chains.push({ x: canvas.width, top: top, bottom: canvas.height - top - gap, passed: false });
                }

                chains.forEach((c, i) => {
                    c.x -= 3;
                    
                    // Zincir Görseli (Bloklar)
                    ctx.fillStyle = "#A855F7";
                    ctx.fillRect(c.x, 0, 60, c.top);
                    ctx.fillRect(c.x, canvas.height - c.bottom, 60, c.bottom);

                    // Çarpışma
                    if (bird.x + bird.w > c.x && bird.x < c.x + 60 && (bird.y < c.top || bird.y + bird.h > canvas.height - c.bottom)) {
                        gameOver();
                    }
                    
                    // Skor
                    if (!c.passed && c.x < bird.x) {
                        score++;
                        scoreDiv.innerText = score;
                        c.passed = true;
                    }
                });

                if (bird.y > canvas.height || bird.y < 0) gameOver();
                frame++;
            }

            // Karakteri Çiz
            ctx.font = "40px serif";
            ctx.fillText(currentSkin, bird.x, bird.y + bird.h);

            requestAnimationFrame(draw);
        }

        function gameOver() {
            gameRunning = false;
            ui.style.display = 'flex';
            document.querySelector('h1').innerText = "SKOR: " + score;
            document.querySelector('.start-btn').innerText = "TEKRAR DENE";
        }

        // Kontroller
        const flap = () => { if(gameRunning) bird.v = bird.jump; };
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') flap(); });
        window.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); });
        window.addEventListener('mousedown', flap);

        draw();
    </script>
</body>
</html>
